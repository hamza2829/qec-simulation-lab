name: CPU QEC lab
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-experiments:
    name: Python ${{ matrix.python }} / CPU tests and reduced sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned CPU Torch and the project
        run: |
          python -m pip install --no-deps torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
          python -c "import torch; assert torch.version.cuda is None; print('CPU Torch:', torch.__version__)"
      - name: Ruff lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Run pytest
        run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - name: Run the same fixed grid with reduced shots on CPU
        run: python -m qec run --quick --output artifacts/quick
      - name: Check the smoke profile and five real PNG plots
        run: |
          python -c "import json; from pathlib import Path; p=Path('artifacts/quick'); assert json.loads((p/'config.json').read_text())['profile']=='quick'; assert len(list((p/'plots').glob('*.png')))==5; assert (p/'report.md').exists(); print('Quick profile, report and five plots verified')"
          git diff --exit-code -- results
      - name: Upload reduced-run reports, JSON, models, plots and test XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qec-cpu-python-${{ matrix.python }}
          path: |
            artifacts/pytest.xml
            artifacts/quick/
          if-no-files-found: warn
          retention-days: 14
